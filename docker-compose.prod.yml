# Production stack for the Hetzner server. Runs alongside the secrets in ./.env
# (NEVER committed). See docs/DEPLOY.md (Phase 7+) for the operational steps.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    # Built and pushed by GitHub Actions (lowercase owner — ghcr requires it).
    image: ghcr.io/soindek/municipal-assistant/backend:latest
    restart: unless-stopped
    env_file: .env
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy

  db:
    # Matches the local dev image (pgvector on Postgres 16).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  caddy_data:
  caddy_config:
  db_data:
